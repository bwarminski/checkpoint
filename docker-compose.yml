# ABOUTME: Defines the slim checkpoint database stack for local development.
# ABOUTME: Runs Postgres and ClickHouse from the sibling collector repo images.
services:
  postgres:
    image: checkpoint-postgres:local
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkpoint_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkpoint_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports: ["5432:5432"]
  clickhouse:
    image: checkpoint-clickhouse:local
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports: ["8123:8123", "9000:9000"]
